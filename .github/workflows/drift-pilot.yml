name: Phase 1 Drift Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - "rules/**"
      - "dataset/source/sigmahq/**"
      - "metadata/pilot_manifest.json"
      - "metadata/telemetry_changes_v1.json"
      - "src/json_eval_core.py"
      - "src/json_baseline_eval.py"
      - "src/telemetry_transform.py"
      - "src/valid_drift_gate.py"
      - "src/drift_eval.py"
      - "src/feasibility_spike.py"
      - "src/risk_audit.py"
      - "tests/test_telemetry_changes.py"
      - "requirements-json-eval.txt"
      - ".github/workflows/drift-pilot.yml"

permissions:
  contents: read

jobs:
  drift-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-json-eval.txt

      - name: Install pinned Sigma tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-json-eval.txt

      - name: Download and verify SigmaHQ json_matcher
        shell: bash
        run: |
          mkdir -p tools/bin
          curl -fsSL https://github.com/SigmaHQ/json_matcher/releases/download/v0.0.2/json_matcher_v0.0.2 -o tools/bin/json_matcher
          echo "abd279e669a04f63db2bb505efc94e36be79d740aec5221b3547b53551966368  tools/bin/json_matcher" | sha256sum -c -
          chmod +x tools/bin/json_matcher

      - name: Run transformation and gate unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Re-verify structured JSON baseline
        run: python src/json_baseline_eval.py --matcher tools/bin/json_matcher

      - name: Run paired telemetry-change pilot
        run: python src/drift_eval.py --matcher tools/bin/json_matcher

      - name: Run development-only S1-S3 feasibility spike
        run: python src/feasibility_spike.py --matcher tools/bin/json_matcher

      - name: F1 candidate source verification and F2-F3 risk audit
        run: python src/risk_audit.py --matcher tools/bin/json_matcher

      - name: Upload development feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftlens-development-feasibility
          path: results/feasibility_spike/
          if-no-files-found: warn

      - name: Upload drift-pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftlens-phase1-drift-pilot
          path: results/drift_pilot/
          if-no-files-found: error
